<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MissedIQ: What did I miss?</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{--navy:#0F1B2D;--navy2:#18283F;--navy3:#22364F;--bg:#F5F6F8;--pan:#fff;--line:#E2E5EA;--ink:#16202E;--mut:#667085;--acc:#2B4C9B;--accbg:#E9EEFA;--red:#B83A3A;--redbg:#FBECEC;--amb:#A8690F;--ambbg:#FBF1DE;--grn:#2C7A55;--grnbg:#E4F3EB;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:272px minmax(0,1fr) 380px;height:100%}
.app.wideview{grid-template-columns:272px minmax(0,1fr)}
.side{background:var(--navy);color:#D6DEEA;display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;font-weight:700;font-size:17px;color:#fff;letter-spacing:-.01em}
.nav{padding:4px 10px;display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:8px;padding:8px 10px;color:#B5C1D3;text-align:left}
.nav button:hover{background:var(--navy2);color:#fff}
.nav button[aria-current=page]{background:var(--navy3);color:#fff}
.nav .n{margin-left:auto;font-size:12px;background:#33496A;border-radius:10px;padding:0 7px}
.search{margin:14px 14px 6px;position:relative}
.search input{width:100%;background:var(--navy2);border:1px solid var(--navy3);border-radius:8px;color:#fff;padding:8px 10px 8px 32px;font:inherit}
.search input::placeholder{color:#8393AB}
.search svg{position:absolute;left:9px;top:9px;color:#8393AB;width:16px;height:16px}
.clist{flex:1;overflow:auto;padding:6px 10px}
.conv{display:flex;gap:10px;width:100%;align-items:center;background:none;border:0;border-radius:8px;padding:9px;text-align:left;color:inherit}
.conv:hover{background:var(--navy2)}
.conv.sel{background:var(--navy3)}
.conv .tx{min-width:0;flex:1}
.conv b{display:block;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv small{display:block;color:#93A3BA;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unr{background:#E5A93C;color:#2a1c00;font-size:11px;font-weight:700;border-radius:10px;min-width:20px;text-align:center;padding:1px 6px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:none}
.av.s{width:28px;height:28px;font-size:11px}
.sbtn{margin:8px 14px 0;display:flex;align-items:center;justify-content:center;gap:8px;background:none;border:1px dashed #3B5070;border-radius:8px;color:#C6D1E1;padding:9px}
.sbtn:hover{background:var(--navy2);color:#fff}
.priv{margin:12px 14px 16px;display:flex;gap:8px;align-items:flex-start;color:#93A3BA;font-size:12px;line-height:1.35}
.priv svg{flex:none;margin-top:1px;color:#6FC39B}
.chat,.ins,.wide{background:var(--pan);display:flex;flex-direction:column;min-height:0;min-width:0}
.ins{border-left:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);min-height:68px}
.hd h1,.hd h2{margin:0;font-size:16px;font-weight:650;letter-spacing:-.01em}
.hd .sub{color:var(--mut);font-size:12.5px}
.hd .sp{flex:1}
.ib{display:none;background:none;border:1px solid var(--line);border-radius:8px;padding:6px;color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:8px;border:1px solid var(--line);background:#fff;padding:8px 14px;font-weight:600}
.btn:hover{background:#F2F4F7}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:#223F84}
.btn[disabled]{opacity:.6;cursor:progress}
.msgs{flex:1;overflow:auto;padding:18px 20px;background:var(--bg);display:flex;flex-direction:column;gap:10px}
.m{display:flex;gap:10px;max-width:640px;scroll-margin:80px}
.bub{background:#fff;border:1px solid var(--line);border-radius:4px 12px 12px 12px;padding:8px 12px;min-width:0;border-left-width:1px}
.bub .w{display:flex;gap:8px;align-items:baseline;font-size:12px}
.bub .w b{font-weight:650}
.bub .w span{color:var(--mut)}
.bub p{margin:2px 0 0;overflow-wrap:anywhere}
.tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:650;border-radius:5px;padding:1px 7px}
.t-urgent{background:var(--redbg);color:var(--red)}.t-tasks{background:var(--accbg);color:var(--acc)}.t-dates{background:var(--ambbg);color:var(--amb)}.t-decisions{background:var(--grnbg);color:var(--grn)}
.m.f-urgent .bub{border-left:3px solid var(--red)}.m.f-dates .bub{border-left:3px solid var(--amb)}.m.f-tasks .bub{border-left:3px solid var(--acc)}.m.f-decisions .bub{border-left:3px solid var(--grn)}
.m.flash .bub{box-shadow:0 0 0 3px #F3D88B;transition:box-shadow .3s}
.foot{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.foot .hint{color:var(--mut);font-size:12.5px;flex:1;min-width:160px}
.body{flex:1;overflow:auto;padding:18px 20px}
.empty{text-align:center;color:var(--mut);padding:28px 8px;max-width:340px;margin:0 auto}
.empty h3{color:var(--ink);font-size:15px;margin:10px 0 6px}
.empty ul{text-align:left;margin:14px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.empty li{display:flex;gap:10px;align-items:center;font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.demo{background:var(--ambbg);color:#6b4308;border-radius:8px;padding:8px 10px;font-size:12.5px;margin-bottom:14px}
.sum{font-size:14.5px;margin:0 0 6px}
.sec{margin-top:20px}
.sec h3{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:13.5px;font-weight:650}
.sec h3 .c{font-weight:600;font-size:12px;border-radius:10px;padding:0 8px}
.it{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff}
.it .r{display:flex;gap:10px;align-items:flex-start}
.it input{margin-top:3px;width:16px;height:16px;accent-color:var(--acc)}
.it.done .itx{text-decoration:line-through;color:var(--mut)}
.it .im{display:flex;gap:10px;align-items:center;margin-top:6px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.lk{background:none;border:0;padding:0;color:var(--acc);font-weight:600;font-size:12px}
.lk:hover{text-decoration:underline}
.lk.sv{margin-left:auto;display:flex;align-items:center;gap:4px;color:var(--mut)}
.lk.sv.on{color:var(--amb)}
.none{color:var(--mut);font-size:13px}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,#ECEEF2,#F6F7F9,#ECEEF2);background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:10px}
@keyframes sh{to{background-position:-200% 0}}
dialog{border:0;border-radius:14px;padding:0;width:min(560px,calc(100vw - 24px));box-shadow:0 20px 60px rgba(15,27,45,.35);color:var(--ink)}
dialog::backdrop{background:rgba(15,27,45,.55)}
dialog form{padding:20px}
dialog h2{margin:0 0 4px;font-size:17px}
dialog p{margin:0 0 12px;color:var(--mut)}
dialog textarea,dialog input[type=text]{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;color:var(--ink)}
dialog textarea{min-height:200px;resize:vertical;margin-top:8px}
.err{color:var(--red);font-size:13px;margin-top:8px;min-height:18px}
.dact{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
@media (max-width:960px){
.app,.app.wideview{grid-template-columns:1fr}
.side,.chat,.ins,.wide{display:none}
[data-pane=list] .side{display:flex}
[data-pane=chat] .chat,[data-pane=chat] .wide{display:flex}
[data-pane=insights] .ins{display:flex}
.ib{display:inline-flex}
.hd{padding:12px 14px}.msgs,.body{padding:14px}.foot{padding:10px 14px}
.hd .hide-m{display:none}
}
</style>
</head>
<body>
<div id="app" class="app" data-pane="list"></div>

<dialog id="dlg">
  <form method="dialog" id="pf" novalidate>
    <h2>Analyze your own chat</h2>
    <p>Paste a conversation, one message per line as <b>Name: message</b>. WhatsApp exports work too. Text stays in this tab.</p>
    <input type="text" id="pname" placeholder="Chat name (optional)" maxlength="40" aria-label="Chat name">
    <textarea id="ptext" placeholder="Rohan: submit the report by Friday 5 PM&#10;Meera: I'll send the slides tonight" aria-label="Chat text"></textarea>
    <div class="err" id="perr" role="alert"></div>
    <div class="dact"><button type="button" class="btn" id="pcancel">Cancel</button><button type="submit" class="btn pri">Analyze chat</button></div>
  </form>
</dialog>

<script>
/* ============ DATA: sample conversations (kept separate from UI) ============ */
const SAMPLE = [
 {name:"BMSIT Project Team",sub:"6 members",unread:14,msgs:[
  ["Rohan","Mon 9:02 AM","morning guys, anyone done the DBMS lab record?"],
  ["Meera","Mon 9:05 AM","lol no. still stuck on the ER diagram"],
  ["Sneha","Mon 9:20 AM","Update: Prof. Kulkarni moved the mini-project review from Friday to Thursday 2 PM, Room 304. Everyone must be present."],
  ["Aarav","Mon 9:21 AM","wait seriously?? we aren't ready 😭"],
  ["Aarav","Mon 9:30 AM","Decided: we'll use Flask + SQLite for the backend, not Django. Less setup."],
  ["Rohan","Mon 9:32 AM","ok fine by me"],
  ["Sneha","Mon 9:40 AM","Rohan, please finish the login and signup pages by Wednesday night."],
  ["Meera","Mon 9:41 AM","I'll prepare the project report draft and send it by Wednesday 6 PM"],
  ["Aarav","Mon 10:15 AM","memes aside, urgent: the synopsis must be uploaded to the portal by tomorrow 5 PM or we lose marks."],
  ["Rohan","Mon 10:16 AM","who is uploading it?"],
  ["Sneha","Mon 10:17 AM","I'll upload it. Aarav can you send me the final PDF tonight?"],
  ["Aarav","Mon 10:18 AM","yep will send tonight"],
  ["Meera","Mon 11:02 AM","canteen later?"],
  ["Rohan","Mon 11:03 AM","obviously 🍟"]]},
 {name:"College Announcements",sub:"412 members",unread:6,msgs:[
  ["Admin Office","Tue 8:00 AM","Reminder: semester fee payment last date is 18 Oct. A late fee of ₹500 per day applies after that."],
  ["Library","Tue 8:40 AM","The library will remain closed on Saturday for stock verification."],
  ["Placement Cell","Tue 9:10 AM","TCS registration is open. All eligible final-year students must register on the portal before 12 Oct, 11:59 PM."],
  ["Sports Dept","Tue 10:00 AM","Inter-department cricket trials this Sunday at 7 AM. Bring your ID card."],
  ["Dean Academics","Tue 11:15 AM","Important: IA-2 schedule has changed. IA-2 now starts 21 Oct instead of 16 Oct. Revised timetable is on the notice board."],
  ["Admin Office","Tue 12:30 PM","Bus route 14 will be rerouted via Hebbal until further notice."],
  ["Placement Cell","Tue 2:00 PM","Submit your updated resume to the placement cell by 10 Oct, 5 PM. Late resumes will not be forwarded."],
  ["Dean Academics","Tue 3:45 PM","It has been decided that attendance below 75% will not be condoned this semester."],
  ["Cultural Club","Tue 4:20 PM","Fest volunteers, please come to the auditorium tomorrow at 4 PM for the briefing."],
  ["Admin Office","Tue 5:00 PM","Thanks everyone, have a good week."]]},
 {name:"Hackathon Team",sub:"4 members",unread:9,msgs:[
  ["Ananya","Fri 6:05 PM","ok team, 24 hours left. where are we?"],
  ["Dev","Fri 6:08 PM","frontend skeleton is done, chat UI looks good"],
  ["Kiran","Fri 6:10 PM","I'm on the analysis logic. regex first, we can upgrade later"],
  ["Isha","Fri 6:20 PM","Judges moved our demo slot to 3:40 PM, it was 4:15 PM. Be at Hall B by 3:20."],
  ["Dev","Fri 6:21 PM","ugh ok"],
  ["Ananya","Fri 6:30 PM","Decision: we're sticking with local-only processing, no cloud API. Privacy is our pitch."],
  ["Isha","Fri 6:34 PM","Ananya, please record the 2 minute demo video and upload it before midnight tonight."],
  ["Ananya","Fri 6:35 PM","on it"],
  ["Kiran","Fri 6:50 PM","Dev can you fix the mobile layout? it breaks under 400px"],
  ["Dev","Fri 6:52 PM","I'll fix it by 8 PM"],
  ["Dev","Fri 6:53 PM","also pizza?"],
  ["Isha","Fri 7:10 PM","Urgent: the submission form closes at 6 AM sharp. Don't miss the GitHub repo link field!"],
  ["Kiran","Fri 7:12 PM","will do the README tonight"]]}
];

/* ============ ANALYSIS ENGINE: swappable. analyze(msgs) -> result ============ */
const RX={
 urgent:/\b(urgent|asap|immediately|important|must|last date|last chance|don['’]t miss|closes|deadline)\b/i,
 tasks:/\b(please|can you|could you|i['’]ll|i will|will do|need to|needs to|submit|register|upload|bring)\b/i,
 dates:/\b(deadline|due|last date|closes?|by|before|until)\b.{0,40}?(\d|tonight|tomorrow|today|midnight|mon|tue|wed|thu|fri|sat|sun)|\b(moved|rescheduled|postponed|preponed|rerouted|closed|cancel{1,2}ed|instead of)\b/i,
 decisions:/\b(decided|decision|finali[sz]ed|confirmed|approved|agreed|sticking with|going with|will not be)\b/i
};
function analyze(msgs){
  const flags={},sections={urgent:[],tasks:[],dates:[],decisions:[]};
  msgs.forEach((m,i)=>{
    const t=m[2],q=/\?\s*$/.test(t)&&!/\b(can you|could you|please)\b/i.test(t);
    Object.keys(RX).forEach(k=>{
      if(k==='tasks'&&q)return;
      if(RX[k].test(t)){(flags[i]=flags[i]||[]).push(k);sections[k].push(i)}
    });
  });
  const flagged=Object.keys(flags).length;
  return {flags,sections,flagged,total:msgs.length,people:new Set(msgs.map(m=>m[0])).size};
}
function parseChat(raw){
  const out=[],ts=/^\[?(\d{1,2}[\/.]\d{1,2}[\/.]\d{2,4}),?\s+(\d{1,2}:\d{2}(?:\s?[APap][Mm])?)\]?\s*[-–]?\s*/;
  raw.split(/\r?\n/).forEach(l=>{
    l=l.trim();if(!l)return;
    const m=l.match(ts),rest=m?l.slice(m[0].length):l,p=rest.match(/^([^:\n]{1,32}):\s+(.+)$/);
    if(p)out.push([p[1].trim(),m?m[1].slice(0,5)+' '+m[2]:'',p[2]]);
    else if(out.length)out[out.length-1][2]+=' '+l;
  });
  return out;
}

/* ============ STATE ============ */
const S={convs:SAMPLE.map((c,i)=>({...c,id:'c'+i})),sel:'c0',view:'inbox',q:'',analysis:{},busy:null,done:{},saved:{},error:''};
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const HUES=['#3F6FB5','#7A5AA6','#2E8B7A','#B5654A','#5B7A3A','#A24A6B'];
const col=n=>HUES[[...n].reduce((a,c)=>a+c.charCodeAt(0),0)%HUES.length];
const ini=n=>n.split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const avatar=(n,s)=>`<span class="av ${s?'s':''}" style="background:${col(n)}" aria-hidden="true">${esc(ini(n))}</span>`;
const P={inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13l3.5 7v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/>',check:'<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/>',bookmark:'<path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>',lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',back:'<path d="M15 18l-6-6 6-6"/>',plus:'<path d="M12 5v14M5 12h14"/>',eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',panel:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/>'};
const ic=(n,z=18,f='none')=>`<svg viewBox="0 0 24 24" width="${z}" height="${z}" fill="${f}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
const SECS=[['urgent','Urgent and important','var(--red)','var(--redbg)'],['tasks','Action items','var(--acc)','var(--accbg)'],['dates','Deadlines and schedule changes','var(--amb)','var(--ambbg)'],['decisions','Decisions','var(--grn)','var(--grnbg)']];
const TAGN={urgent:'Urgent',tasks:'Task',dates:'Date or change',decisions:'Decision'};
const cur=()=>S.convs.find(c=>c.id===S.sel);
const openTasks=()=>S.convs.reduce((n,c)=>{const a=S.analysis[c.id];return n+(a?a.sections.tasks.filter(i=>!S.done[c.id+':'+i]).length:0)},0);

/* ============ UI COMPONENTS ============ */
function Sidebar(){
  const list=S.convs.filter(c=>c.name.toLowerCase().includes(S.q.toLowerCase()));
  const nav=[['inbox','Inbox','inbox',''],['actions','Action Items','check',openTasks()||''],['saved','Saved Insights','bookmark',Object.keys(S.saved).length||'']];
  return `<aside class="side"><div class="brand"><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" fill="#2B4C9B"/><path d="M8 9h12M8 14h8M8 19h5" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="21" cy="19" r="3.2" fill="#E5A93C"/></svg>MissedIQ</div>
  <nav class="nav" aria-label="Main">${nav.map(n=>`<button data-act="nav" data-v="${n[0]}" ${S.view===n[0]?'aria-current="page"':''}>${ic(n[2])}${n[1]}${n[3]?`<span class="n">${n[3]}</span>`:''}</button>`).join('')}</nav>
  <div class="search">${ic('search',16)}<input id="q" type="search" placeholder="Search conversations" value="${esc(S.q)}" aria-label="Search conversations"></div>
  <div class="clist">${list.map(c=>`<button class="conv ${c.id===S.sel&&S.view==='inbox'?'sel':''}" data-act="sel" data-id="${c.id}">${avatar(c.name)}<span class="tx"><b>${esc(c.name)}</b><small>${esc(c.sub)} · ${c.msgs.length} messages</small></span>${c.unread?`<span class="unr" aria-label="${c.unread} unread">${c.unread}</span>`:''}</button>`).join('')||'<p class="none" style="padding:10px;color:#93A3BA">No conversations match.</p>'}</div>
  <button class="sbtn" data-act="paste">${ic('plus',16)}Analyze your own chat</button>
  <div class="priv">${ic('lock',16)}<span>Chat text stays in this tab. Nothing is sent to a server.</span></div></aside>`;
}
function Chat(c){
  const a=S.analysis[c.id],busy=S.busy===c.id;
  return `<main class="chat"><header class="hd"><button class="ib" data-act="pane" data-p="list" aria-label="Back to conversations">${ic('back')}</button>${avatar(c.name)}<div><h1>${esc(c.name)}</h1><div class="sub">${esc(c.sub)}${c.custom?' · pasted':''}</div></div><span class="sp"></span>
  ${a?`<button class="ib" data-act="pane" data-p="insights" aria-label="Show insights">${ic('panel')}</button>`:''}</header>
  <div class="msgs" id="msgs" tabindex="0" aria-label="Messages">${c.msgs.map((m,i)=>{const f=a&&a.flags[i];return `<div class="m ${f?'f-'+f[0]:''}" id="m${i}">${avatar(m[0],1)}<div class="bub"><div class="w"><b>${esc(m[0])}</b><span>${esc(m[1])}</span></div><p>${esc(m[2])}</p>${f?`<div class="tags">${f.map(k=>`<span class="tag t-${k}">${TAGN[k]}</span>`).join('')}</div>`:''}</div></div>`}).join('')}</div>
  <div class="foot"><span class="hint">${a?`Scan finished: ${a.flagged} of ${a.total} messages flagged.`:'Scan this conversation for urgent items, tasks, dates and decisions.'}</span>
  <button class="btn pri" data-act="analyze" ${busy?'disabled':''}>${ic('eye',16)}${busy?'Scanning…':a?'Scan again':'What did I miss?'}</button></div></main>`;
}
function Item(c,i,k,showSrc=true){
  const m=c.msgs[i],key=c.id+':'+i,sk=key+':'+k,on=S.saved[sk];
  return `<div class="it ${k==='tasks'&&S.done[key]?'done':''}"><div class="r">${k==='tasks'?`<input type="checkbox" data-act="done" data-key="${key}" ${S.done[key]?'checked':''} aria-label="Mark done">`:''}<div class="itx">${esc(m[2])}</div></div>
  <div class="im"><span>${esc(m[0])}${m[1]?' · '+esc(m[1]):''}</span>${showSrc?`<button class="lk" data-act="src" data-c="${c.id}" data-i="${i}">View source</button>`:''}<button class="lk sv ${on?'on':''}" data-act="save" data-key="${sk}" aria-pressed="${!!on}">${ic('bookmark',14,on?'currentColor':'none')}${on?'Saved':'Save'}</button></div></div>`;
}
function Insights(c){
  const a=S.analysis[c.id];let body;
  if(S.busy===c.id)body='<div class="skel" style="width:90%"></div><div class="skel" style="width:70%"></div><div class="skel" style="width:80%;height:60px"></div><div class="skel" style="width:60%"></div>';
  else if(!a)body=`<div class="empty">${ic('eye',34)}<h3>Nothing scanned yet</h3>Select <b>What did I miss?</b> and this panel will show:<ul>${SECS.map(s=>`<li><span class="dot" style="background:${s[2]}"></span>${s[1]}</li>`).join('')}<li><span class="dot" style="background:var(--mut)"></span>Links back to the original messages</li></ul></div>`;
  else body=`<div class="demo"><b>Keyword scan, not AI.</b> This rule-based pass runs in your browser and can miss or over-flag items. Check each result against its source message.</div>
   <h3 style="margin:0 0 4px;font-size:13.5px">Summary</h3><p class="sum">${a.total} messages from ${a.people} ${a.people===1?'person':'people'}. ${a.flagged?`${a.flagged} flagged: ${a.sections.urgent.length} urgent, ${a.sections.tasks.length} tasks, ${a.sections.dates.length} deadlines or changes, ${a.sections.decisions.length} decisions.`:'No urgent items, tasks, dates or decisions were detected.'}</p>
   ${SECS.map(s=>{const ids=a.sections[s[0]];return `<section class="sec"><h3>${s[1]}<span class="c" style="background:${s[3]};color:${s[2]}">${ids.length}</span></h3>${ids.length?ids.map(i=>Item(c,i,s[0])).join(''):'<div class="none">None found.</div>'}</section>`}).join('')}`;
  return `<aside class="ins"><header class="hd"><button class="ib" data-act="pane" data-p="chat" aria-label="Back to chat">${ic('back')}</button><div><h2>What you missed</h2><div class="sub">${esc(c.name)}</div></div></header><div class="body">${body}</div></aside>`;
}
function Wide(){
  let h='';
  if(S.view==='actions'){
    const groups=S.convs.filter(c=>S.analysis[c.id]&&S.analysis[c.id].sections.tasks.length);
    h=groups.length?groups.map(c=>`<section class="sec" style="margin-top:0;margin-bottom:22px"><h3>${esc(c.name)}</h3>${S.analysis[c.id].sections.tasks.map(i=>Item(c,i,'tasks')).join('')}</section>`).join(''):`<div class="empty">${ic('check',34)}<h3>No action items yet</h3>Run <b>What did I miss?</b> on a conversation and its tasks will collect here.</div>`;
  }else{
    const keys=Object.keys(S.saved);
    h=keys.length?SECS.map(s=>{const rows=keys.filter(k=>k.endsWith(':'+s[0]));return rows.length?`<section class="sec" style="margin-top:0;margin-bottom:22px"><h3>${s[1]}<span class="c" style="background:${s[3]};color:${s[2]}">${rows.length}</span></h3>${rows.map(k=>{const [cid,i]=k.split(':');const c=S.convs.find(x=>x.id===cid);return `<div class="none" style="margin:0 0 4px">${esc(c.name)}</div>`+Item(c,+i,s[0])}).join('')}</section>`:''}).join(''):`<div class="empty">${ic('bookmark',34)}<h3>Nothing saved yet</h3>Use <b>Save</b> on any finding to keep it here.</div>`;
  }
  return `<main class="wide"><header class="hd"><button class="ib" data-act="pane" data-p="list" aria-label="Back">${ic('back')}</button><h1>${S.view==='actions'?'Action Items':'Saved Insights'}</h1><span class="sp"></span><span class="sub hide-m">Held in this tab only. Clears on refresh.</span></header><div class="body" style="max-width:720px">${h}</div></main>`;
}
function render(keepScroll=true){
  const ms=$('#msgs'),sc=ms?ms.scrollTop:0,qf=document.activeElement&&document.activeElement.id==='q',pane=app.dataset.pane;
  const c=cur();
  app.className='app'+(S.view!=='inbox'?' wideview':'');
  app.innerHTML=Sidebar()+(S.view==='inbox'?Chat(c)+Insights(c):Wide());
  app.dataset.pane=pane;
  const n=$('#msgs');if(n&&keepScroll)n.scrollTop=sc;
  if(qf){const q=$('#q');q.focus();q.setSelectionRange(q.value.length,q.value.length)}
}
function setPane(p){app.dataset.pane=p}

/* ============ INTERACTIONS ============ */
function runAnalysis(id){
  S.busy=id;render();
  setTimeout(()=>{const c=S.convs.find(x=>x.id===id);S.analysis[id]=analyze(c.msgs);S.busy=null;if(S.sel===id&&S.view==='inbox'){render();setPane('insights');app.dataset.pane=matchMedia('(max-width:960px)').matches?'insights':app.dataset.pane}},650);
}
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const d=b.dataset;
  switch(b.dataset.act){
    case 'nav':S.view=d.v;render();setPane(d.v==='inbox'?'list':'chat');break;
    case 'sel':S.view='inbox';S.sel=d.id;cur().unread=0;render(false);setPane('chat');{const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight}break;
    case 'analyze':runAnalysis(S.sel);break;
    case 'paste':$('#perr').textContent='';$('#dlg').showModal();$('#ptext').focus();break;
    case 'pane':setPane(d.p);break;
    case 'done':S.done[d.key]=b.checked;render();break;
    case 'save':S.saved[d.key]?delete S.saved[d.key]:S.saved[d.key]=1;render();break;
    case 'src':{
      if(S.sel!==d.c||S.view!=='inbox'){S.sel=d.c;S.view='inbox';render()}
      setPane('chat');const el=document.getElementById('m'+d.i);
      if(el){el.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1800)}
      break}
  }
});
app.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;render()}});

/* paste dialog */
const dlg=$('#dlg');
$('#pcancel').onclick=()=>dlg.close();
$('#pf').addEventListener('submit',e=>{
  e.preventDefault();
  const raw=$('#ptext').value.trim(),err=$('#perr');
  if(!raw){err.textContent='Paste a conversation first. Use one message per line as Name: message.';return}
  const msgs=parseChat(raw);
  if(msgs.length<3){err.textContent=msgs.length?`Only ${msgs.length} message${msgs.length>1?'s':''} found. Add at least 3 lines in the form Name: message.`:'No sender names found. Start each line with Name: followed by the message.';return}
  if(raw.length>200000){err.textContent='That chat is too long. Paste up to 200,000 characters.';return}
  const id='u'+Date.now(),name=$('#pname').value.trim()||'Pasted chat';
  S.convs.unshift({id,name,sub:new Set(msgs.map(m=>m[0])).size+' people',unread:0,msgs,custom:true});
  S.sel=id;S.view='inbox';S.q='';dlg.close();$('#ptext').value='';$('#pname').value='';
  render(false);setPane('chat');runAnalysis(id);
});
render();
</script>
</body>
</html>
